name: Publish Python SDK
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version in python/pyproject.toml
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-python
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release identity
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PYTHON'
          import os, tomllib
          project = tomllib.load(open('pyproject.toml', 'rb'))['project']
          assert project['name'] == 'kuahr'
          assert project['version'] == os.environ['RELEASE_VERSION']
          PYTHON
      - run: python -m pip install -e '.[dev]' build twine
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: python/dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish kuahr using PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
